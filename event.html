<!doctype html>
<html lang="en">
<head>
  <title>Event | Jatra</title>
  <meta name="description" content="Event details and registration on Jatra.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Apply the saved theme before the page paints, so it never flashes. */
    try {
      var savedTheme = localStorage.getItem("jatra-theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="Jatra, home">
        <span class="brand__mark" aria-hidden="true"></span>Jatra
      </a>
      <nav aria-label="Main">
        <ul class="nav">
          <li><a href="index.html#events">Events</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="register.html#my-registrations">My registrations</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div id="event-root">
      <div class="container"><p class="breadcrumb">Loading event&hellip;</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Jatra, a student project for K Explore: Web Designing. All events listed are fictional.</p>
      <p>&copy; <span data-year>2026</span> Jatra</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="event.js"></script>
</body>
</html>
